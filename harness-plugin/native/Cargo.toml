[package]
name = "md2chat-clipboard"
version = "0.1.0"
description = "md2chat's native chat clipboard writer (DingTalk, Feishu) as a stdin/stdout CLI for the DeepSeek Harness plugin"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# The clipboard and image modules are compiled from src-tauri/src by #[path];
# these dependencies mirror the ones they use in src-tauri/Cargo.toml.
[dependencies]
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
