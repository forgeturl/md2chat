name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep Release publication and its Pages deployment together across versions.
  group: desktop-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify release version and notes before building
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
  validate:
    needs: preflight
    # Validation and packaging start together after tag preflight.
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: win
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Consume the matching release cache without replacing it with debug output.
          shared-key: build-${{ matrix.target }}
          save-if: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/build-desktop.cjs
      - name: Test native desktop modules
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Verify native Windows clipboard and CF_HTML cases
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/qa | Out-Null
          npm run desktop:test:windows 2>&1 | Tee-Object -FilePath release/qa/windows-clipboard.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows clipboard evidence and manual cases
        if: always() && matrix.platform == 'win'
        uses: actions/upload-artifact@v7
        with:
          name: windows-clipboard-qa-release
          if-no-files-found: error
          retention-days: 3
          path: |
            release/qa/windows-clipboard.txt
            docs/windows-clipboard-qa.md
            examples/windows-clipboard/
  mac_binaries:
    needs: preflight
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            lipo_arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15
            arch: x64
            lipo_arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate immutable caches prevent the parallel targets racing to save one key.
          shared-key: build-${{ matrix.target }}
      - run: npm ci
      - name: Compile unsigned Mac binary
        run: node scripts/build-desktop-release.cjs mac ${{ matrix.arch }} --compile-only${{ github.event_name == 'workflow_dispatch' && ' --test-build' || '' }}
        env:
          # The public updater key is embedded at compile time; no signing secret is exposed here.
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      - name: Verify thin binary architecture
        run: lipo src-tauri/target/${{ matrix.target }}/release/md2chat -verify_arch ${{ matrix.lipo_arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac-binary-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: src-tauri/target/${{ matrix.target }}/release/md2chat
  mac_package:
    needs: [preflight, mac_binaries]
    if: ${{ !cancelled() && needs.mac_binaries.result == 'success' && (needs.preflight.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: mac-binary-arm64
          path: release/mac-thin/aarch64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          name: mac-binary-x64
          path: release/mac-thin/x86_64-apple-darwin
      - name: Create universal Mac binary
        run: |
          lipo release/mac-thin/aarch64-apple-darwin/md2chat -verify_arch arm64
          lipo release/mac-thin/x86_64-apple-darwin/md2chat -verify_arch x86_64
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create release/mac-thin/aarch64-apple-darwin/md2chat release/mac-thin/x86_64-apple-darwin/md2chat -output src-tauri/target/universal-apple-darwin/release/md2chat
          chmod 755 src-tauri/target/universal-apple-darwin/release/md2chat
          lipo src-tauri/target/universal-apple-darwin/release/md2chat -verify_arch arm64 x86_64
      - name: Build signed and notarized Mac installer
        run: node scripts/build-desktop-release.cjs mac universal --prebuilt${{ github.event_name == 'workflow_dispatch' && ' --test-build' || '' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-universal
          if-no-files-found: error
          retention-days: 3
          # DMG and tar.gz artifacts are already compressed.
          compression-level: 0
          path: |
            release/*.dmg
            release/*.app.tar.gz
            release/*.sig
  windows_package:
    needs: preflight
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: build-x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build Windows installer
        run: node scripts/build-desktop-release.cjs win x64${{ github.event_name == 'workflow_dispatch' && ' --test-build' || '' }}
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          if-no-files-found: error
          retention-days: 3
          # NSIS installers are already compressed.
          compression-level: 0
          path: |
            release/*.exe
            release/*.sig
  build-site:
    needs: preflight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The default checkout uses the same version tag as the installers.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
          retention-days: 3
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, mac_package, windows_package, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recheck release version and notes before publication
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify complete release and calculate checksums
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node scripts/update-manifests.cjs release
          node scripts/release-assets.cjs release
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.app.tar.gz release/*.exe release/*.sig release/latest.json release/SHA256SUMS.txt --title "md2chat $GITHUB_REF_NAME · macOS / Windows" --notes-file docs/release-notes.md --draft --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
  deploy-pages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check release is still Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest_tag" = "$GITHUB_REF_NAME" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deployment: this version is no longer Latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy released website
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
