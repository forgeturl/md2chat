name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep Release publication and its Pages deployment together across versions.
  group: desktop-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release version and notes before building
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: preflight
    # Manual installer verification is allowed when tag-only preflight is skipped.
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: universal
            target: dmg zip
          - os: windows-latest
            platform: win
            arch: x64
            target: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build signed and notarized Mac installer
        if: matrix.platform == 'mac'
        run: node scripts/build-desktop-release.cjs mac universal
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: node scripts/build-desktop-release.cjs win ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
  build-site:
    needs: preflight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The default checkout uses the same version tag as the installers.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 3
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recheck release version and notes before publication
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify complete release and calculate checksums
        run: |
          node scripts/update-manifests.cjs release
          node scripts/release-assets.cjs release
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/*.exe release/latest.yml release/latest-mac.yml release/SHA256SUMS.txt --title "md2chat $GITHUB_REF_NAME · macOS / Windows" --notes-file docs/release-notes.md --draft --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
  deploy-pages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check release is still Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest_tag" = "$GITHUB_REF_NAME" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Pages deployment: this version is no longer Latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy released website
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
