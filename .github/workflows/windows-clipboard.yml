name: Windows clipboard validation
on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-clipboard-owner-lifetime]
    paths:
      - 'src-tauri/**'
      - 'assets/tauri-bridge.js'
      - 'assets/app.js'
      - 'assets/wecom-segments.js'
      - 'scripts/inspect-windows-clipboard.ps1'
      - 'package*.json'
      - 'examples/windows-clipboard/**'
      - '.github/workflows/windows-clipboard.yml'
permissions:
  contents: read
concurrency:
  group: windows-clipboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clipboard:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Consume the full release cache without replacing it with debug-only output.
          shared-key: build
          save-if: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/build-desktop.cjs
      - name: Test native Rust clipboard and CF_HTML reader
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/qa | Out-Null
          npm run desktop:test:windows 2>&1 | Tee-Object -FilePath release/qa/windows-clipboard.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload evidence and manual DingTalk cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-clipboard-qa
          retention-days: 3
          if-no-files-found: error
          path: |
            release/qa/windows-clipboard.txt
            docs/windows-clipboard-qa.md
            examples/windows-clipboard/
