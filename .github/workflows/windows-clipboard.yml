name: Windows clipboard validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Version bumps and web-only edits use Check; release tags still run Windows QA.
      - 'src-tauri/src/clipboard/**'
      - '!src-tauri/src/clipboard/macos.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/src/shell.rs'
      - 'src-tauri/src/shortcuts/**'
      - 'src-tauri/src/preferences.rs'
      - 'src-tauri/src/images.rs'
      - 'src-tauri/build.rs'
      - 'src-tauri/tauri.conf.json'
      - 'scripts/native.cjs'
      - 'scripts/native-env.cjs'
      - 'scripts/build-desktop.cjs'
      - 'scripts/inspect-windows-clipboard.ps1'
      - 'tests/windows-clipboard-workflow.test.cjs'
      - 'examples/windows-clipboard/**'
      - '.github/workflows/windows-clipboard.yml'
permissions:
  contents: read
concurrency:
  group: windows-clipboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clipboard:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Consume the full release cache without replacing it with debug-only output.
          shared-key: build-x86_64-pc-windows-msvc
          save-if: false
      - run: npm ci
      - name: Test native Rust clipboard and CF_HTML reader
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/qa | Out-Null
          npm run desktop:test:windows 2>&1 | Tee-Object -FilePath release/qa/windows-clipboard.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shortcuts and desktop regression
        run: node scripts/native.cjs cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload evidence and manual DingTalk cases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-clipboard-qa
          retention-days: 3
          if-no-files-found: error
          path: |
            release/qa/windows-clipboard.txt
            docs/windows-clipboard-qa.md
            examples/windows-clipboard/
